services:
  alldebrid-connector:
    # Uses the published image; `docker compose up --build` builds from source instead.
    image: ghcr.io/rafe95/alldebrid-connector:latest
    build: .
    container_name: alldebrid-connector
    restart: unless-stopped
    ports:
      # LAN only: there is no authentication. Do not expose this port to the internet.
      # Host port for the API (what Radarr connects to). Override with API_PORT.
      - "${API_PORT:-8080}:8080"
    environment:
      ALLDEBRID_API_KEY: ${ALLDEBRID_API_KEY:?set ALLDEBRID_API_KEY in .env or your shell}
      # Extra or overridden categories, as name=/path pairs. tv, movies, adult and
      # other exist by default under /downloads.
      # AD_CATEGORY_DIRS: "sonarr=/downloads/tv,radarr=/downloads/movies"
      # AD_DELETE_AFTER_DOWNLOAD: "true"
      # AD_MAX_DOWNLOADS: "2"
    volumes:
      - ./data:/data
      # Change the left side to your media folder on the host.
      - ./downloads:/downloads

  # Optional web UI: static files served by nginx, which forwards /api/ to the connector.
  # Remove this service if you only use the API or Radarr.
  web:
    image: docker.io/library/nginx:1-alpine
    container_name: alldebrid-connector-web
    restart: unless-stopped
    depends_on:
      - alldebrid-connector
    ports:
      # Host port for the web UI. Override with WEB_PORT.
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
